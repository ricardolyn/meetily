# Workspace-wide build settings. Cargo reads config from the directory it is
# run in and its parents, so builds started at the repo root (e.g.
# `cargo build -p llama-helper`) don't see frontend/src-tauri/.cargo/config.toml.

[env]
# Same macOS minimum as the app (frontend/src-tauri/.cargo/config.toml).
# Without it, the llama-helper sidecar targets whatever macOS the build
# machine runs, and won't launch on older Macs.
MACOSX_DEPLOYMENT_TARGET = { value = "14.2", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = "14.2"

# llama-helper only loads local models, so llama.cpp's HTTP helper needs no
# HTTPS. Its vendored cpp-httplib doesn't compile against OpenSSL 4 (now
# Homebrew's default); llama-cpp-sys-2 forwards CMAKE_* vars to CMake, and
# this stops CMake from finding OpenSSL at all.
CMAKE_DISABLE_FIND_PACKAGE_OpenSSL = "ON"
